<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado – Trabalho 11: tanque SD-501 e bombas</title>
<style>
:root{--bg:#eef1f4;--pn:#fff;--tx:#17202b;--mu:#5d6b7c;--bd:#cfd6df;--ac:#0a64c8;--on:#16a34a;--of:#c3cad4;--er:#d93f3f;--wn:#c77a10;--fl:#3b86d6;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0f141a;--pn:#18202a;--tx:#e5eaf1;--mu:#92a1b3;--bd:#2c3745;--ac:#5aa8ff;--on:#37d67a;--of:#374252;--er:#ff7070;--wn:#f0a54a;--fl:#4a9bf0;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--pn)}
h1{font-size:18px;margin:0}h2{font-size:13px;margin:12px 0 6px;color:var(--mu);font-weight:600}h2:first-child{margin-top:0}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;padding:12px;max-width:1100px;margin:auto}
@media(max-width:760px){main{grid-template-columns:1fr}}
section{background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:12px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}.mu{color:var(--mu)}
button,select{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.led{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:1px solid var(--bd);border-radius:6px;font-variant-numeric:tabular-nums}
.led i{width:10px;height:10px;border-radius:50%;background:var(--of)}.led.on i{background:var(--on);box-shadow:0 0 6px var(--on)}.led.al.on i{background:var(--er);box-shadow:0 0 6px var(--er)}
.pump{border:1px solid var(--bd);border-radius:6px;padding:6px 8px;margin-bottom:6px}.pump b{min-width:5.5em}
input[type=range]{width:160px}.big{font-size:22px;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block}.t{fill:var(--tx);font:11px system-ui}.m{fill:var(--mu);font:10px system-ui}.o{fill:var(--pn);stroke:var(--tx);stroke-width:1.5}
</style></head><body>
<header><h1>Trabalho 11 · Tanque SD-501 e bombas</h1>
<div class="row"><label>Velocidade <select id="sp"><option value="1">1×</option><option value="5">5×</option><option value="10">10×</option></select></label><button id="rs">Reiniciar CLP</button></div></header>
<main>
<section><h2>Tanque SD-501</h2>
<svg viewBox="0 0 260 250" role="img" aria-label="Tanque com nível e setpoints dos alarmes">
<rect x="50" y="20" width="100" height="200" class="o"/><rect id="lv" x="52" y="218" width="96" height="0" fill="var(--fl)"/>
<g id="sps"></g><g id="pm"></g></svg>
<div class="big" id="nv">0,0 %</div><div class="mu" id="ma"></div>
<h2>Nível</h2>
<div class="row"><label>Modo <select id="md"><option value="d">Dinâmico (vazão e bombas)</option><option value="m">Manual (cursor)</option></select></label></div>
<div class="row"><label>Nível manual <input type="range" id="lm" min="0" max="100" value="50" aria-label="Nível manual"></label></div>
<div class="row"><label>Vazão de entrada <input type="range" id="qi" min="0" max="12" step="0.5" value="7" aria-label="Vazão de entrada"></label><span class="mu" id="qv"></span></div>
<div class="row"><label><input type="checkbox" id="wv"> Balanço da plataforma (±3 %)</label></div></section>
<section><h2>Alarmes (retardo de 3 s)</h2><div class="row" id="al"></div><p class="mu" id="at"></p>
<h2>Bombas</h2><div id="pp"></div>
<div class="row" id="emr"></div>
<p class="mu">Reproduz as networks do arquivo .md. DESLIGA e EME são NF (acesos = pressionados). Cada bomba retira 4 %/s do tanque.</p></section>
</main>
<script>
const $=s=>document.querySelector(s),E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h)e.innerHTML=h;return e};
class TON{constructor(p){this.p=p;this.t=0;this.q=0}u(i,d){if(i){this.t=Math.min(this.p,this.t+d);this.q=+(this.t>=this.p)}else{this.t=0;this.q=0}}}
const I={};
function btn(par,key,txt,mode,init){const b=E('button','',txt);par.append(b);const nf=mode.includes('n'),tog=mode[0]==='t';
 const set=v=>{I[key]=nf?(v?0:1):(v?1:0);b.classList.toggle('on',!!v);b.setAttribute('aria-pressed',!!v)};set(init||0);
 if(tog)b.onclick=()=>{set(!b.classList.contains('on'));if(b.id)b.textContent=lbl(b)};
 else{b.onpointerdown=()=>set(1);b.onpointerup=b.onpointerleave=b.onpointercancel=()=>set(0);
  b.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();set(1)}};b.onkeyup=()=>set(0)}return b}
const lbl=b=>b.classList.contains('on')?'Liberar emergência (EME pressionada)':'Pressionar emergência (EME)';
const eb=btn($('#emr'),'EME','','tn');eb.id='eb';eb.textContent=lbl(eb);
const AL=['LL','LO','HI','HH'],A=[0,0,0,0],Q=[0,0,0,0],U=[1,0,0,0],TL=AL.map(()=>new TON(3));
AL.forEach((k,i)=>{const l=E('span','led al','<i></i>LTSD501_'+k);$('#al').append(l);AL[i]={n:k,l}});
const PL=[];
for(let k=0;k<4;k++){const r=E('div','pump row');r.append(E('b','','B_501_'+(k+1)));
 const au=btn(r,'au'+k,'AUTO','t',1);au.onclick=()=>{const v=!au.classList.contains('on');au.classList.toggle('on',v);I['au'+k]=+v;au.textContent=v?'AUTO':'MANUAL'};
 btn(r,'li'+k,'LIGA','m');btn(r,'de'+k,'DESLIGA (NF)','n');
 const l=E('span','led','<i></i>comando');r.append(l);PL.push(l);$('#pp').append(r)}
const SP=[10,20,80,90];let sp=1,Lv=50,meas=50,tt=0;
$('#sps').innerHTML=SP.map((v,i)=>{const y=218-v*1.96;return`<line x1="50" x2="150" y1="${y}" y2="${y}" stroke="var(--wn)" stroke-dasharray="4 3"/><text x="156" y="${y+4}" class="m">${AL[i].n} ${v}%</text>`}).join('');
function scan(d){
 const n=meas;[n<=10,n<=20,n>=80,n>=90].forEach((c,i)=>{TL[i].u(c,d);A[i]=TL[i].q});
 const[LL,LO,HI,HH]=A;U[0]=!LL&&!LO;U[1]=HI||HH;U[2]=HH;U[3]=HH;
 for(let k=0;k<4;k++){const au=I['au'+k];Q[k]=+!!(((au&&U[k])||(!au&&(I['li'+k]||Q[k])&&I['de'+k]))&&I.EME)}
}
function plant(d){
 const q=+$('#qi').value;$('#qv').textContent=q.toFixed(1)+' %/s';tt+=d;
 const man=$('#md').value==='m';$('#lm').disabled=!man;$('#qi').disabled=man;
 Lv=man?+$('#lm').value:Math.max(0,Math.min(100,Lv+(q-4*Q.reduce((a,b)=>a+b,0))*d));
 meas=Math.max(0,Math.min(100,Lv+($('#wv').checked?3*Math.sin(tt*2.2):0)));
}
function draw(){
 const h=meas*1.96;$('#lv').setAttribute('y',218-h);$('#lv').setAttribute('height',h);
 $('#nv').textContent=meas.toFixed(1).replace('.',',')+' %';
 $('#ma').textContent=`Sinal do transmissor: ${(4+16*meas/100).toFixed(2)} mA · bruto ${Math.round(5530+22118*meas/100)}`;
 AL.forEach((a,i)=>a.l.classList.toggle('on',!!A[i]));
 $('#at').textContent='Temporizadores: '+TL.map((t,i)=>AL[i].n+' '+t.t.toFixed(1)+' s').join(' · ');
 PL.forEach((l,k)=>l.classList.toggle('on',!!Q[k]));
 $('#pm').innerHTML=Q.map((q,k)=>`<circle cx="200" cy="${60+k*40}" r="12" fill="${q?'var(--on)':'var(--pn)'}" stroke="var(--tx)" stroke-width="1.5"/><text x="200" y="${64+k*40}" text-anchor="middle" class="t">B${k+1}</text>`).join('');
}
$('#sp').onchange=e=>sp=+e.target.value;
$('#rs').onclick=()=>{Q.fill(0);TL.forEach(t=>t.u(0,0));Lv=50};
setInterval(()=>{const d=.05*sp;plant(d);scan(d);draw()},50);
</script></body></html>
